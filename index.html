<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סימולטור מפע"ם</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#1c2230;--muted:#6a7284;--line:#e2e5ec;--accent:#2b59d1;--accent2:#e9eefc;--ok:#1d9a54;--okbg:#e6f6ec;--bad:#d24343;--badbg:#fdeceC;--warn:#b77c00;}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:18px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap}
header h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.2px}
header h1 small{font-weight:400;color:var(--muted);font-size:13px;margin-inline-start:6px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--accent2);color:var(--accent)}
main{max-width:1280px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:18px}
.card h3{margin:0 0 8px;font-size:15px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row+.row{margin-top:10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#c6cbd6}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#244cb5}
.btn.danger{color:var(--bad)}
.btn.big{font-size:18px;padding:13px 28px;border-radius:12px}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.q-v.on{background:#7a3fc4;border-color:#7a3fc4}
.chip.q-q.on{background:#0f8a7a;border-color:#0f8a7a}
.lbl{font-size:13px;color:var(--muted);font-weight:500}
.sep{width:1px;height:24px;background:var(--line)}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
input[type=number]{width:80px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--bg);border-radius:10px;padding:8px 12px;min-width:110px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center}
.hero h2{font-size:26px;margin:0 0 6px}
.steps{margin:0;padding-inline-start:20px}
.steps li{margin:4px 0}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%}
th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--muted);font-weight:500;font-size:13px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);background:#1c2230;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;z-index:100;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--bad)}
#toast.ok{background:var(--ok)}
.warnbox{background:#fff6e0;border:1px solid #f0d58a;color:#7a5600;border-radius:10px;padding:10px 14px;margin-bottom:14px}
/* import */
.toolbar{position:sticky;top:56px;z-index:20;padding:12px 16px}
.imp-main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
.pages-wrap{overflow-x:auto}
.pages{--zoom:1}
.page{position:relative;width:calc(var(--zoom)*100%);margin:0 auto 16px;background:#fff;box-shadow:0 1px 5px #0002;user-select:none;-webkit-user-select:none}
.page img{display:block;width:100%;pointer-events:none}
.page.crop{cursor:crosshair;touch-action:none}
.page .pno{position:absolute;top:6px;left:8px;font-size:12px;color:var(--muted);background:#fffc;padding:0 6px;border-radius:6px}
.sel-rect{position:absolute;border:2px dashed var(--accent);background:#2b59d11f;pointer-events:none}
.done-rect{position:absolute;border:2px solid var(--ok);background:#1d9a5412;pointer-events:none}
.done-rect span{position:absolute;top:-2px;right:-2px;background:var(--ok);color:#fff;font-size:11px;padding:0 5px;border-radius:0 0 0 6px}
.done-rect.g{border-color:#7a3fc4;background:#7a3fc410}.done-rect.g span{background:#7a3fc4}
aside.items{position:sticky;top:var(--aside-top,200px);max-height:calc(100vh - var(--aside-top,200px) - 16px);overflow:auto;padding:14px}
@media(max-width:960px){.imp-main{grid-template-columns:1fr}aside.items{position:static;max-height:none}.toolbar{top:0;position:relative}}
.empty-pages{border:2px dashed var(--line);border-radius:14px;padding:50px 20px;text-align:center;color:var(--muted);background:#fff}
.it{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
.it.child{margin-inline-start:22px;border-style:dashed}
.it.grp{background:#f7f2fd;border-color:#dccbf3}
.it.last{box-shadow:0 0 0 2px var(--accent)}
.it .num{font-weight:700;text-align:center;font-size:14px}
.it .thumb{max-width:100%;max-height:70px;object-fit:contain;object-position:right;cursor:zoom-in;display:block;border:1px solid var(--line);border-radius:4px;background:#fff}
.it .meta{grid-column:2/3;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.it .tlabel{font-size:12px;color:var(--muted)}
.ab{display:inline-flex;gap:3px}
.ab button{width:28px;height:26px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-weight:700;font-size:13px;padding:0}
.ab button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.it.noans .ab button{border-color:#f0c6c6}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 6px;border-radius:6px;align-self:start}
.x:hover{background:var(--badbg);color:var(--bad)}
.x.confirm{background:var(--bad);color:#fff;font-size:12px}
.modal{position:fixed;inset:0;background:#0009;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.modal img{max-width:95vw;max-height:92vh;background:#fff;border-radius:6px}
/* exam */
body.in-exam{overflow:hidden}
#exam{position:fixed;inset:0;background:#fff;z-index:60;display:flex;flex-direction:column}
#exam[hidden]{display:none}
.exam-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);background:#fafbfc}
.ex-info{font-size:15px}
.ex-info b{color:var(--accent)}
.timer{font-variant-numeric:tabular-nums;font-size:24px;font-weight:800;min-width:90px;text-align:center}
.timer.low{color:var(--bad)}
.exam-body{flex:1;overflow:auto;display:flex;gap:20px;padding:20px}
.exam-body .ctx{flex:1 1 50%;overflow:auto;border-inline-end:1px solid var(--line);padding-inline-end:20px}
.exam-body .qp{flex:1 1 50%;overflow:auto;max-width:980px;margin:0 auto}
.exam-body.single .qp{flex:1 1 100%}
.qimg{max-width:100%;display:block;margin:0 auto 10px;border-radius:4px}
.imgs{overflow-x:auto;max-width:100%}
.exam-body .qp,.exam-body .ctx{min-width:0}
.zoomer{display:inline-flex;align-items:center;gap:4px}
.ctx .qimg{margin:0 0 10px}
.ctx-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.answers{display:flex;gap:12px;justify-content:center;margin:22px 0 14px}
.ans{width:70px;height:58px;font-size:24px;font-weight:700;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.ans:hover{border-color:#b9c3dc}
.ans.sel{border-color:var(--accent);background:var(--accent2);color:var(--accent)}
.center{text-align:center}
.pre-note{background:var(--accent2);color:#1d3d91;border-radius:10px;padding:10px 14px;margin-bottom:14px;text-align:center;font-weight:500}
.break-box{margin:auto;text-align:center}
.break-box .timer{font-size:64px;margin:16px 0}
.essay-wrap{max-width:900px;margin:0 auto;width:100%}
.essay-wrap textarea{width:100%;min-height:52vh;line-height:1.9;font-size:16px;resize:vertical}
@media(max-width:820px){.exam-top{padding:8px 10px;gap:6px}.ex-info{font-size:13px}.timer{font-size:20px;min-width:60px}.zoomer .small{display:none}.exam-body{flex-direction:column;padding:14px}.exam-body .ctx{flex:none;max-height:none;overflow:visible;border:0;padding:0 0 14px;border-bottom:1px solid var(--line)}.exam-body .qp{overflow:visible}.ans{width:60px;height:52px}}
/* results */
.sec-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.sc{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.sc .big{font-size:34px;font-weight:800}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.rv{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.rv.ok{border-inline-start:5px solid var(--ok)}
.rv.bad{border-inline-start:5px solid var(--bad)}
.rv-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:14px}
.rv .qimg{margin:0 0 8px;max-width:min(100%,760px)}
.pill{border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.gray{background:var(--bg);color:var(--muted)}
.ansrow{display:flex;gap:6px}
.ansrow span{width:30px;height:28px;border:1px solid var(--line);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.ansrow span.correct{background:var(--ok);border-color:var(--ok);color:#fff}
.ansrow span.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
details.ctxd{background:#f7f2fd;border-radius:10px;padding:8px 12px;margin:14px 0 8px}
details.ctxd summary{cursor:pointer;font-weight:500;color:#5b2ea0}
.prefs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 24px}
.prefs-grid label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
details.help summary{cursor:pointer;color:var(--accent);font-weight:500}
details.help ol{margin:8px 0 0;padding-inline-start:20px}
details.help li{margin:3px 0}
.hist-row{cursor:pointer}
.hist-row:hover{background:var(--bg)}
kbd{background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>סימולטור מפע"ם <small>תרגול מבחנים פסיכומטריים ישנים בפורמט מפע"ם</small></h1>
  <nav id="nav">
    <button data-v="home">בית</button>
    <button data-v="import">ייבוא מבחן</button>
    <button data-v="bank">מאגר שאלות</button>
    <button data-v="past">היסטוריה</button>
    <button data-v="prefs">הגדרות</button>
  </nav>
</header>
<main id="main"></main>
<div id="exam" hidden></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
'use strict';
/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const h = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = s => { s = Math.ceil(s); const m = Math.floor(s / 60), r = s % 60; return m + ':' + String(r).padStart(2, '0'); };
const fmtDate = t => new Date(t).toLocaleString('he-IL', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
function toast(msg, kind = '') { const el = $('#toast'); el.textContent = msg; el.className = 'show ' + kind; clearTimeout(toast.t); toast.t = setTimeout(() => el.className = '', 2800); }
const ls = {
  get(k, d) { try { const v = localStorage.getItem('mafaam:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('mafaam:' + k, JSON.stringify(v)); } catch { } }
};
function twoClick(btn, label, fn) {
  btn.addEventListener('click', e => {
    e.stopPropagation();
    if (btn.dataset.armed) { fn(); return; }
    btn.dataset.armed = '1'; const old = btn.innerHTML; btn.innerHTML = label; btn.classList.add('confirm');
    setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.innerHTML = old; btn.classList.remove('confirm'); } }, 2500);
  });
}
function zoomImg(src) { const m = h(`<div class="modal"><img src="${src}"></div>`); m.onclick = () => m.remove(); document.body.append(m); }

/* ================= model ================= */
const SECTION = { verbal: 'חשיבה מילולית', quant: 'חשיבה כמותית', essay: 'חיבור' };
const TYPES = {
  analogy:       { label: 'אנלוגיות', section: 'verbal', kind: 'q' },
  sentence:      { label: 'השלמת משפטים', section: 'verbal', kind: 'q' },
  comprehension: { label: 'הבנה והסקה', section: 'verbal', kind: 'q' },
  passage:       { label: 'קטע קריאה', section: 'verbal', kind: 'group', child: 'passageQ' },
  passageQ:      { label: 'שאלה על קטע', section: 'verbal', kind: 'child', parent: 'passage' },
  problem:       { label: 'שאלות ובעיות', section: 'quant', kind: 'q' },
  chart:         { label: 'תרשים / טבלה', section: 'quant', kind: 'group', child: 'chartQ' },
  chartQ:        { label: 'שאלה על תרשים', section: 'quant', kind: 'child', parent: 'chart' },
  essay:         { label: 'נושא חיבור', section: 'essay', kind: 'essay' }
};
const Q_TYPES = ['analogy', 'sentence', 'comprehension', 'problem'];
const DEFAULTS = {
  times: { analogy: 1.5, sentence: 3, comprehension: 4, passage: 7, passageQ: 4, problem: 4, chart: 7, chartQ: 4 },
  count: { analogy: 5, sentence: 5, comprehension: 5, passage: 1, problem: 14, chart: 1 },
  essay: true, essayMin: 30, breakMin: 5, adaptive: true, avoidSeen: true
};
function loadSettings() {
  const s = ls.get('settings', {});
  return { ...DEFAULTS, ...s, times: { ...DEFAULTS.times, ...(s.times || {}) }, count: { ...DEFAULTS.count, ...(s.count || {}) } };
}
let S = loadSettings();
const saveSettings = () => ls.set('settings', S);

/* ================= storage (IndexedDB) ================= */
const store = { db: null, tests: new Map(), items: new Map() };
const idbReq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function dbInit() {
  try {
    const r = indexedDB.open('mafaam-sim', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('tests', { keyPath: 'id' }); d.createObjectStore('items', { keyPath: 'id' }); };
    store.db = await idbReq(r);
    for (const name of ['tests', 'items']) {
      const all = await idbReq(store.db.transaction(name).objectStore(name).getAll());
      all.forEach(o => store[name].set(o.id, o));
    }
  } catch (e) { console.warn(e); store.db = null; storageBroken = true; }
}
let storageBroken = false;
function dbPutMany(name, objs) {
  objs.forEach(o => store[name].set(o.id, o));
  if (!store.db) return Promise.resolve();
  return new Promise(res => {
    const tx = store.db.transaction(name, 'readwrite'); const os = tx.objectStore(name);
    objs.forEach(o => os.put(o));
    tx.oncomplete = res;
    tx.onerror = tx.onabort = () => { toast('שגיאת שמירה: ' + (tx.error && tx.error.name), 'bad'); res(); };
  });
}
const dbPut = (name, obj) => dbPutMany(name, [obj]);
function dbDelMany(name, ids) {
  ids.forEach(id => store[name].delete(id));
  if (!store.db) return Promise.resolve();
  return new Promise(res => { const tx = store.db.transaction(name, 'readwrite'); const os = tx.objectStore(name); ids.forEach(id => os.delete(id)); tx.oncomplete = res; tx.onerror = res; });
}

/* ================= queries ================= */
const allItems = () => [...store.items.values()];
const byOrder = (a, b) => a.order - b.order;
const childrenOf = gid => allItems().filter(i => i.groupId === gid).sort(byOrder);
const testItems = tid => allItems().filter(i => i.testId === tid).sort(byOrder);
const chapterItems = (tid, ch) => testItems(tid).filter(i => i.chapter === ch);
function isUsable(i) {
  const k = TYPES[i.type].kind;
  if (k === 'q') return i.answer >= 1;
  if (k === 'group') return childrenOf(i.id).some(c => c.answer >= 1);
  if (k === 'essay') return true;
  return false;
}
function bankCounts() {
  const c = {}; Object.keys(TYPES).forEach(t => c[t] = 0);
  let missing = 0;
  for (const i of allItems()) {
    const k = TYPES[i.type].kind;
    if (k === 'child') { if (i.answer >= 1) c[i.type]++; else missing++; continue; }
    if (k === 'q' && !(i.answer >= 1)) { missing++; continue; }
    if (isUsable(i)) c[i.type]++;
  }
  return { c, missing };
}
/* difficulty: position of the question inside its type, inside its original chapter (old tests go easy -> hard) */
function computeDifficulty() {
  const groups = {};
  for (const i of allItems()) {
    const k = TYPES[i.type].kind;
    if (k !== 'q' && k !== 'group') continue;
    const key = i.testId + '|' + i.chapter + '|' + i.type;
    (groups[key] = groups[key] || []).push(i);
  }
  for (const arr of Object.values(groups)) { arr.sort(byOrder); arr.forEach((it, idx) => it._d = (idx + 0.5) / arr.length); }
}

/* ================= navigation ================= */
let view = 'home', RESULT_ID = null;
function go(v) {
  view = v;
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  render(); window.scrollTo(0, 0);
}
function render() {
  const m = $('#main'); m.innerHTML = '';
  if (storageBroken) m.append(h(`<div class="warnbox">הדפדפן לא מאפשר שמירה מקומית — המאגר יישמר רק עד סגירת הדף. מומלץ לפתוח את האפליקציה בדפדפן רגיל (לא גלישה בסתר).</div>`));
  ({ home: renderHome, import: renderImport, bank: renderBank, prefs: renderPrefs, past: renderPast, result: renderResult, review: renderReview })[view](m);
  if (narrow()) sizeImgsIn(m, QZ);
}
$('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.v); });

/* ================= HOME ================= */
function renderHome(m) {
  const { c, missing } = bankCounts();
  const verbalN = c.analogy + c.sentence + c.comprehension + c.passageQ;
  const quantN = c.problem + c.chartQ;
  const can = verbalN + quantN > 0;
  m.append(h(`<div class="card hero">
    <div>
      <h2>תרגול בפורמט מפע"ם</h2>
      <p class="muted" style="margin:0 0 14px">שאלה אחת בכל פעם, זמן נפרד לכל שאלה, אי אפשר לדלג או לחזור, והמבחן מתאים את רמת הקושי לתשובות שלך. לפני כל קטע קריאה וכל תרשים יש ${S.times.passage} / ${S.times.chart} דקות לעיון בלבד, ורק אז מופיעות השאלות.</p>
      <div class="row"><button class="btn primary big" id="startBtn" ${can ? '' : 'disabled'}>התחל סימולציה</button>

async function planPages(progress) {

    if (!p.chapter && !isEssay) continue;
    const body = p.items.filter(x => x.y > 0.09 && x.y < 0.93 && x.x < 0.93 && x.x + x.w > 0.07);
    if (!body.length || body.every(x => /עמוד ריק/.test(x.s))) continue;

/* ================= EXAM ENGINE ================= */
let EX = null, TM = null;
function stopTimer() { if (TM) clearInterval(TM); TM = null; }
function startTimer(sec, onEnd) {
  stopTimer(); const end = performance.now() + sec * 1000;
  const tick = () => {
    const left = Math.max(0, (end - performance.now()) / 1000);
    const el = $('#exTimer'); if (el) { el.textContent = fmt(left); el.classList.toggle('low', left <= 30); }
    if (left <= 0) { stopTimer(); onEnd(); }
  };
  TM = setInterval(tick, 200); tick();
}
// which test the simulation draws from (null = mix of all tests); remembered per device
let EXAM_TEST = ls.get('examTest', null);
function testsWithQs() { return [...store.tests.values()].sort((a, b) => a.created - b.created).filter(t => testItems(t.id).some(i => ['q', 'child'].includes(TYPES[i.type].kind) && i.answer >= 1)); }
function usableOf(type) { return allItems().filter(i => i.type === type && isUsable(i) && (!EXAM_TEST || i.testId === EXAM_TEST)); }
function startExam() {
  if (EXAM_TEST && !testsWithQs().some(t => t.id === EXAM_TEST)) { EXAM_TEST = null; ls.set('examTest', null); }
  computeDifficulty();
  const has = t => usableOf(t).length > 0;
  const slots = [];
  if (S.essay) slots.push({ kind: 'essay' }, { kind: 'break', label: 'הפסקה — סוף החיבור' });
  for (const t of ['analogy', 'sentence', 'comprehension']) if (S.count[t] > 0 && has(t)) slots.push({ kind: 'block', type: t, left: S.count[t] });
  if (S.count.passage > 0 && has('passage')) slots.push({ kind: 'groups', type: 'passage', left: S.count.passage });
  slots.push({ kind: 'break', label: 'הפסקה — סוף החלק המילולי' });
  const pN = S.count.problem; const p1 = Math.ceil(pN / 2);
  if (pN > 0 && has('problem')) slots.push({ kind: 'block', type: 'problem', left: p1 });
  if (S.count.chart > 0 && has('chart')) slots.push({ kind: 'groups', type: 'chart', left: S.count.chart });
  if (pN - p1 > 0 && has('problem')) slots.push({ kind: 'block', type: 'problem', left: pN - p1 });
  // prune breaks that are first / last / doubled
  const pruned = [];
  slots.forEach(s => { if (s.kind === 'break' && (!pruned.length || pruned.at(-1).kind === 'break')) return; pruned.push(s); });
  while (pruned.length && pruned.at(-1).kind === 'break') pruned.pop();
  if (!pruned.some(s => s.kind === 'block' || s.kind === 'groups')) { toast('אין במאגר שאלות עם תשובה נכונה — סמנו שאלות קודם', 'bad'); return; }
  EX = { id: uid(), date: Date.now(), slots: pruned, si: 0, theta: { verbal: 0.5, quant: 0.5 }, nAns: { verbal: 0, quant: 0 }, qn: { verbal: 0, quant: 0 }, used: new Set(), seen: new Set(ls.get('seen', [])), log: [], groupRead: {}, essay: null, key: null };
  document.body.classList.add('in-exam'); $('#exam').hidden = false;
  advance();
}
function pickFrom(cands, section) {
  if (!cands.length) return null;
  if (S.avoidSeen) { const fresh = cands.filter(c => !EX.seen.has(c.id)); if (fresh.length) cands = fresh; }
  if (S.adaptive && section !== 'essay') {
    const th = EX.theta[section];
    cands = [...cands].sort((a, b) => Math.abs((a._d ?? .5) - th) - Math.abs((b._d ?? .5) - th));
    const top = cands.slice(0, 3).filter(c => Math.abs((c._d ?? .5) - th) <= Math.abs((cands[0]._d ?? .5) - th) + 0.12);
    return top[Math.floor(Math.random() * top.length)];
  }
  return cands[Math.floor(Math.random() * cands.length)];
}
const pick = type => pickFrom(usableOf(type).filter(i => !EX.used.has(i.id)), TYPES[type].section);
function advance() {
  EX.key = null;
  const slot = EX.slots[EX.si];
  if (!slot) return finishExam();
  if (slot.kind === 'essay' || slot.kind === 'break') {
    if (slot.shown) { EX.si++; return advance(); }
    slot.shown = true; return slot.kind === 'essay' ? showEssay() : showBreak(slot);
  }
  if (slot.kind === 'block') {
    if (slot.left > 0) { const it = pick(slot.type); if (it) { slot.left--; EX.used.add(it.id); return showQuestion(it, null); } }
    EX.si++; return advance();
  }
  if (slot.kind === 'groups') {
    if (slot.queue && slot.queue.length) return showQuestion(slot.queue.shift(), slot.group);
    if (slot.left > 0) {
      const g = pick(slot.type);
      if (g) { slot.left--; EX.used.add(g.id); slot.group = g; slot.queue = childrenOf(g.id).filter(c => c.answer >= 1); return showPreview(g); }
    }
    EX.si++; return advance();
  }
}
// question image size = scale of the crop's own pixels, so text looks the same size in every question.
// Phones default to 0.8 and scroll long lines sideways; desktop default 1 = fit the column.
const narrow = () => window.innerWidth < 820;
const qzKey = () => narrow() ? 'qz-m' : 'qz-d';
let QZ = ls.get(qzKey(), narrow() ? 0.8 : 1);
function sizeQImg(im, z = QZ) {
  if (!im.naturalWidth) return;
  if (!narrow() && z === 1) { im.style.width = ''; im.style.maxWidth = '100%'; return; }
  im.style.maxWidth = 'none'; im.style.width = Math.round(im.naturalWidth * z) + 'px';
}
function sizeImgsIn(root, z) { if (!root) return; $$('.qimg', root).forEach(im => { const f = () => sizeQImg(im, z); if (im.complete) f(); else im.addEventListener('load', f, { once: true }); }); }
function setQZoom(z) { QZ = clamp(Math.round(z * 20) / 20, 0.4, 2); ls.set(qzKey(), QZ); sizeImgsIn($('#exam'), QZ); }
function imgsHtml(item) { return `<div class="imgs">${item.imgs.map(s => `<img class="qimg" src="${s}" alt="">`).join('')}</div>`; }
function shell(info, body, cls = 'single') {
  $('#exam').innerHTML = `<div class="exam-top"><div class="ex-info">${info}</div><div class="timer" id="exTimer"></div><div class="row" style="gap:6px;flex-wrap:nowrap"><span class="zoomer"><button class="btn sm" id="qzOut" title="הקטן">−</button><span class="small">גודל</span><button class="btn sm" id="qzIn" title="הגדל">+</button></span><button class="btn sm" id="exQuit">יציאה</button></div></div><div class="exam-body ${cls}">${body}</div>`;
  twoClick($('#exQuit'), 'לצאת? המבחן לא יישמר', quitExam);
  $('#qzIn').onclick = () => setQZoom(QZ + 0.1); $('#qzOut').onclick = () => setQZoom(QZ - 0.1);
  sizeImgsIn($('#exam'), QZ);
  $('.exam-body').scrollTop = 0;
}
function quitExam() { stopTimer(); EX = null; $('#exam').hidden = true; $('#exam').innerHTML = ''; document.body.classList.remove('in-exam'); go('home'); }
function showQuestion(item, group) {
  const T = TYPES[item.type]; const sec = T.section; EX.qn[sec]++;
  const info = `<b>${SECTION[sec]}</b> · ${T.label} · שאלה ${EX.qn[sec]}`;
  const ctx = group ? `<div class="ctx"><div class="ctx-label">${TYPES[group.type].label}</div>${imgsHtml(group)}</div>` : '';
  shell(info, `${ctx}<div class="qp">${imgsHtml(item)}
    <div class="answers">${[1, 2, 3, 4].map(n => `<button class="ans" data-n="${n}">${n}</button>`).join('')}</div>
    <div class="center"><button class="btn primary big" id="exNext">אישור והמשך ←</button><div class="small muted" style="margin-top:8px">אי אפשר לחזור לשאלה אחרי האישור</div></div></div>`, group ? 'split' : 'single');
  let chosen = 0, armed = false, done = false; const t0 = performance.now();
  const choose = n => { chosen = n; armed = false; $('#exNext').textContent = 'אישור והמשך ←'; $$('.ans').forEach(b => b.classList.toggle('sel', +b.dataset.n === n)); };
  $$('.ans').forEach(b => b.onclick = () => choose(+b.dataset.n));
  const next = () => { if (!chosen && !armed) { armed = true; $('#exNext').textContent = 'להמשיך בלי לענות?'; return; } record(false); };
  $('#exNext').onclick = next;
  EX.key = e => { if (/^[1-4]$/.test(e.key)) choose(+e.key); else if (e.key === 'Enter') { e.preventDefault(); next(); } };
  function record(timedOut) {
    if (done) return; done = true; stopTimer();
    const ok = chosen === item.answer;
    EX.log.push({ id: item.id, groupId: group ? group.id : null, section: sec, type: item.type, chosen, correct: item.answer, ok, time: Math.round((performance.now() - t0) / 1000), limit: S.times[item.type] * 60, timedOut, d: item._d ?? null, theta: EX.theta[sec] });
    if (S.adaptive) { const k = EX.nAns[sec]++; const step = Math.max(0.05, 0.2 * Math.pow(0.88, k)); EX.theta[sec] = clamp(EX.theta[sec] + (ok ? step : -step), 0, 1); }
    advance();
  }
  startTimer(S.times[item.type] * 60, () => record(true));
}
function showPreview(group) {
  const T = TYPES[group.type]; const mins = S.times[group.type];
  const what = group.type === 'passage' ? 'לקרוא את הקטע' : 'לעיין בתרשים / בטבלה';
  shell(`<b>${SECTION[T.section]}</b> · ${T.label} · זמן עיון`, `<div class="qp">
    <div class="pre-note">יש לך ${mins} דקות ${what}. השאלות יופיעו אחר כך, וה${T.label} יישאר מוצג לידן.</div>
    ${imgsHtml(group)}
    <div class="center" style="margin-top:16px"><button class="btn primary big" id="exNext">סיימתי, עבור לשאלות ←</button></div></div>`);
  const t0 = performance.now(); let done = false;
  const go2 = () => { if (done) return; done = true; stopTimer(); EX.groupRead[group.id] = Math.round((performance.now() - t0) / 1000); advance(); };
  $('#exNext').onclick = go2;
  startTimer(mins * 60, go2);
}
function showEssay() {
  const topics = usableOf('essay').filter(i => !EX.used.has(i.id));
  const topic = topics.length ? pickFrom(topics, 'essay') : null;
  if (topic) EX.used.add(topic.id);
  shell(`<b>חיבור</b> · 25–50 שורות`, `<div class="essay-wrap">
    ${topic ? imgsHtml(topic) : `<div class="pre-note">לא הועלו נושאי חיבור למאגר — כתבו נושא בעצמכם בשורה הראשונה, או סמנו נושאים בייבוא (סוג "נושא חיבור").</div>`}
    <textarea id="essayTxt" spellcheck="false" autocorrect="off" autocapitalize="off" placeholder="כתבו כאן את החיבור…"></textarea>
    <div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted small" id="wc">0 מילים</span><button class="btn primary" id="exNext">סיימתי את החיבור ←</button></div></div>`);
  const ta = $('#essayTxt'); ta.focus();
  ta.oninput = () => { const w = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0; $('#wc').textContent = `${w} מילים · בערך ${Math.max(0, Math.round(w / 11))} שורות`; };
  let done = false;
  const fin = () => { if (done) return; done = true; stopTimer(); EX.essay = { topicId: topic ? topic.id : null, text: ta.value }; advance(); };
  twoClick($('#exNext'), 'בטוח? אי אפשר לחזור', fin);
  startTimer(S.essayMin * 60, fin);
}
function showBreak(slot) {
  shell(`<b>הפסקה</b>`, `<div class="break-box"><h2>${esc(slot.label)}</h2><div class="timer" id="exTimer2"></div><button class="btn primary big" id="exNext">קצר את ההפסקה והמשך ←</button></div>`);
  $('#exTimer').id = 'exTimerTop'; $('#exTimer2').id = 'exTimer';
  let done = false; const fin = () => { if (done) return; done = true; stopTimer(); advance(); };
  $('#exNext').onclick = fin;
  startTimer(S.breakMin * 60, fin);
}
function finishExam() {
  stopTimer();
  const tst = EXAM_TEST && store.tests.get(EXAM_TEST);
  const rec = { id: EX.id, date: EX.date, log: EX.log, essay: EX.essay, theta: EX.theta, groupRead: EX.groupRead, testName: tst ? tst.name : 'מעורב' };
  const hist = ls.get('history', []); hist.unshift(rec); ls.set('history', hist.slice(0, 60));
  const seen = new Set(ls.get('seen', [])); EX.used.forEach(id => seen.add(id)); ls.set('seen', [...seen]);
  EX = null; $('#exam').hidden = true; $('#exam').innerHTML = ''; document.body.classList.remove('in-exam');
  RESULT_ID = rec.id; go('result');
}
document.addEventListener('keydown', e => {
  if (EX) { if (EX.key && !/TEXTAREA|INPUT/.test(e.target.tagName)) EX.key(e); return; }
  if (view === 'import' && IMP.lastItemId && /^[1-4]$/.test(e.key) && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) setAnswer(IMP.lastItemId, +e.key);
});

/* ================= RESULTS ================= */
function renderResult(m) {
  const rec = ls.get('history', []).find(r => r.id === RESULT_ID);
  if (!rec) { m.append(h('<div class="card">התוצאה לא נמצאה.</div>')); return; }
  const secs = ['verbal', 'quant'].filter(s => rec.log.some(e => e.section === s));
  const cards = h(`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">תוצאות הסימולציה</h2><span class="muted small">${esc(rec.testName || "")}${rec.testName ? " · " : ""}${fmtDate(rec.date)}</span></div><div class="sec-cards" style="margin-top:14px"></div></div>`);
  secs.forEach(s => {
    const e = rec.log.filter(x => x.section === s); const ok = e.filter(x => x.ok).length; const pct = Math.round(100 * ok / e.length);
    const to = e.filter(x => x.timedOut).length;
    cards.querySelector('.sec-cards').append(h(`<div class="sc"><div class="muted">${SECTION[s]}</div><div class="big">${ok}/${e.length}</div><div class="bar"><i style="width:${pct}%"></i></div>
      <div class="small muted" style="margin-top:8px">${pct}% נכונות${to ? ` · ${to} נגמר הזמן` : ''}<br>רמת קושי שאליה הגעת: <b>${Math.round(rec.theta[s] * 100)}</b>/100</div></div>`));
  });
  m.append(cards);
  const types = [...new Set(rec.log.map(e => e.type))];
  const tt = h(`<div class="card"><h3>לפי סוג שאלה</h3><table><thead><tr><th>סוג</th><th>נכונות</th><th>זמן ממוצע</th><th>זמן מוקצב</th></tr></thead><tbody></tbody></table></div>`);
  types.forEach(t => {
    const e = rec.log.filter(x => x.type === t); const ok = e.filter(x => x.ok).length;
    const avg = e.reduce((a, x) => a + x.time, 0) / e.length;
    tt.querySelector('tbody').append(h(`<tr><td>${TYPES[t].label}</td><td>${ok}/${e.length} (${Math.round(100 * ok / e.length)}%)</td><td>${fmt(avg)}</td><td>${fmt(e[0].limit)}</td></tr>`));
  });
  m.append(tt);
  if (rec.essay && rec.essay.text.trim()) {
    const w = rec.essay.text.trim().split(/\s+/).length;
    const topic = rec.essay.topicId && store.items.get(rec.essay.topicId);
    const ed = h(`<details class="card"><summary style="cursor:pointer;font-weight:700">החיבור שלך (${w} מילים)</summary><div style="margin-top:10px">${topic ? imgsHtml(topic) : ''}<div style="white-space:pre-wrap;line-height:1.9">${esc(rec.essay.text)}</div></div></details>`);
    m.append(ed);
  }
  const rv = h(`<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">סקירת שאלות</h3><label class="small"><input type="checkbox" id="onlyBad"> הצג רק טעויות</label></div><div id="rvList" style="margin-top:12px"></div></div>`);
  m.append(rv);
  const draw = () => {
    const only = $('#onlyBad', rv).checked; const list = $('#rvList', rv); list.innerHTML = '';
    let lastG = null; const n = { verbal: 0, quant: 0 };
    rec.log.forEach(e => {
      n[e.section]++;
      if (only && e.ok) return;
      if (e.groupId && e.groupId !== lastG) {
        const g = store.items.get(e.groupId);
        if (g) list.append(h(`<details class="ctxd"><summary>${TYPES[g.type].label} — לחצו להצגה${rec.groupRead && rec.groupRead[g.id] != null ? ` · זמן עיון: ${fmt(rec.groupRead[g.id])}` : ''}</summary><div style="margin-top:8px">${imgsHtml(g)}</div></details>`));
      }
      lastG = e.groupId;
      const it = store.items.get(e.id);
      const status = e.ok ? '<span class="pill ok">נכון</span>' : e.chosen ? '<span class="pill bad">שגוי</span>' : `<span class="pill bad">${e.timedOut ? 'נגמר הזמן' : 'לא נענתה'}</span>`;
      list.append(h(`<div class="rv ${e.ok ? 'ok' : 'bad'}"><div class="rv-head"><b>${SECTION[e.section]} · שאלה ${n[e.section]}</b><span class="muted">${TYPES[e.type].label}</span>${status}<span class="pill gray">${fmt(e.time)} מתוך ${fmt(e.limit)}</span></div>
        ${it ? imgsHtml(it) : '<p class="muted small">השאלה נמחקה מהמאגר.</p>'}
        <div class="ansrow">${[1, 2, 3, 4].map(k => `<span class="${k === e.correct ? 'correct' : k === e.chosen ? 'wrong' : ''}">${k}</span>`).join('')}<span style="border:0;width:auto" class="small muted">&nbsp;ירוק = התשובה הנכונה${!e.ok && e.chosen ? ', אדום = מה שענית' : ''}</span></div></div>`));
    });
    if (!list.children.length) list.append(h('<p class="muted">אין טעויות 🎉</p>'));
    if (narrow()) sizeImgsIn(list, QZ);
  };
  $('#onlyBad', rv).onchange = draw; draw();
  m.append(h(`<div class="center"><button class="btn primary big" id="again">סימולציה נוספת</button></div>`));
  $('#again').onclick = startExam;
}

/* ================= boot ================= */
(async () => {
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  await dbInit();
  go('home');
})();
</script>
